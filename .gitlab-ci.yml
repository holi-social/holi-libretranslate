variables:
  API_DOMAIN_PATH: "$CI_PROJECT_DIR/api_domain"

default:
  before_script:
    - set -eux
    - env
  interruptible: true
  tags:
    - 1cpu-4gb

stages:
  - build
  - deploy

build_docker:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  stage: "build"
  variables:
    ARTIFACT_IMAGE: europe-north1-docker.pkg.dev/holi-shared/docker/holi-libretranslate
  cache:
    key:
      files:
        - Dockerfile
      prefix: docker-cache
    paths:
      - ~/.docker
      - ~/.cache
  before_script:
    - mkdir -p ~/.docker
    - cat $GOOGLE_CLOUD_SERVICE_ACCOUNT | docker login -u _json_key --password-stdin https://europe-north1-docker.pkg.dev
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo '===> building LibreTranslate image'
    - docker pull $ARTIFACT_IMAGE || true
    - docker build --cache-from $ARTIFACT_IMAGE --cache-to type=inline -t $ARTIFACT_IMAGE:latest -t $ARTIFACT_IMAGE:$CI_COMMIT_SHA -t $ARTIFACT_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $ARTIFACT_IMAGE:$CI_COMMIT_SHA
    - docker push $ARTIFACT_IMAGE:$CI_COMMIT_REF_SLUG

.deploy:
  stage: "deploy"
  image:
    name: "hashicorp/terraform:1.6.1"
    entrypoint: ["/bin/sh", "-c"]
  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - $API_DOMAIN_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 week
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  script:
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA

staging_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: "staging"
  only:
    - main

production_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: "production"
  only:
    - production
