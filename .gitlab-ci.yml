variables:
  API_DOMAIN_PATH: "$CI_PROJECT_DIR/api_domain"

default:
  before_script:
    - set -eu
    # env -0 | sort -z | tr '\0' '\n': Sort env output alphabetically, keeping multiline variables intact
    # egrep: Remove sensitive information from the output of env
    #- env -0 | sort -z | tr '\0' '\n' | egrep -ve '^(DOCKER_AUTH_CONFIG|GOOGLE_APPLICATION_CREDENTIALS)=.*'
  interruptible: true
  tags:
    - 1cpu-4gb

stages:
  - build
  - deploy

build_docker:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:27'
  services:
    - name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:27-dind'
      alias: 'docker'
  stage: "build"
  variables:
    ARTIFACT_IMAGE: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-libretranslate'
  script:
    - echo '===> building LibreTranslate image'
    - docker pull "$ARTIFACT_IMAGE" || true
    - docker build --cache-from "$ARTIFACT_IMAGE" -t "$ARTIFACT_IMAGE":latest -t "$ARTIFACT_IMAGE":"$CI_COMMIT_SHA" -t "$ARTIFACT_IMAGE":"$CI_COMMIT_REF_SLUG" .
    - docker push "$ARTIFACT_IMAGE":"$CI_COMMIT_SHA"
    - docker push "$ARTIFACT_IMAGE":"$CI_COMMIT_REF_SLUG"
    - docker push "$ARTIFACT_IMAGE":latest # for caching the build

.deploy:
  stage: "deploy"
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.10.5'
    entrypoint: ["/bin/sh", "-c"]
  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - $API_DOMAIN_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 week
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  script:
    - terraform/environments/scripts/create-or-update-env.sh "$ENVIRONMENT_ID" "$CI_COMMIT_SHA"

staging_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: "staging"
  only:
    - main

production_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: "production"
  only:
    - production
