variables:
  API_DOMAIN_PATH: "$CI_PROJECT_DIR/api_domain"

default:
  before_script:
    - set -eu
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)
  interruptible: true
  tags:
    - 1cpu-4gb

stages:
  - build
  - deploy

build_docker:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29'
  services:
    - name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29-dind'
      alias: 'docker'
  stage: "build"
  variables:
    ARTIFACT_IMAGE: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-libretranslate'
  script:
    - echo '===> building LibreTranslate image'
    - docker pull "$ARTIFACT_IMAGE" || true
    - docker build --cache-from "$ARTIFACT_IMAGE" -t "$ARTIFACT_IMAGE":latest -t "$ARTIFACT_IMAGE":"$CI_COMMIT_SHA" -t "$ARTIFACT_IMAGE":"$CI_COMMIT_REF_SLUG" .
    - docker push "$ARTIFACT_IMAGE":"$CI_COMMIT_SHA"
    - docker push "$ARTIFACT_IMAGE":"$CI_COMMIT_REF_SLUG"
    - docker push "$ARTIFACT_IMAGE":latest # for caching the build

.deploy:
  stage: "deploy"
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.13.5'
    entrypoint: ["/bin/sh", "-c"]
  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - $API_DOMAIN_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 week
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  script:
    - terraform/environments/scripts/create-or-update-env.sh "$ENVIRONMENT_ID" "$CI_COMMIT_SHA"
    - echo "$(terraform/environments/scripts/get-output.sh api_domain)" > "$API_DOMAIN_PATH"

.smoketest:
  stage: "deploy"
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/holi-k6-builder'
  script:
    - API_DOMAIN=$(cat "$API_DOMAIN_PATH")
    - terraform/environments/scripts/wait-for-ssl.sh "https://${API_DOMAIN}"
    - BASE_URL="https://${API_DOMAIN}" k6 run smoketest/main.js
    # TODO should/could we roll back the service to the last working revision on test failure?

staging_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: "staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

staging_smoketest:
  extends: .smoketest
  needs: ['staging_deploy']
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

production_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: "production"
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success

production_smoketest:
  extends: .smoketest
  needs: ['production_deploy']
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success
